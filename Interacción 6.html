<!doctype html>
<html lang="en">
  <head>
    <title>Capítulo 6</title>
    <link
      id="favicon"
      rel="icon"
      href="assets/images/prota.png"
      type="image/x-icon"
    />
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Asar&display=swap');


      body, html {
        margin: 0;
        padding: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }

      .fondo-vagon {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: contain; 
        background-color: rgba(30, 30, 30, 0.925);
        z-index: -1;
      }

.contenedor-imagenes {
display: flex;
  justify-content: center; 
  align-items: flex-end;
  gap: 0;                /* Eliminamos el espacio automático entre imágenes */
  width: 100%;             
  box-sizing: border-box;  
  flex-grow: 1;          
  padding-bottom: 0; 
}

.imagen {
/* Mantenemos tus anchos originales */
  width: calc(50% - 10px); 
  max-width: 23%;        
  height: auto;            
  object-fit: contain;   
  display: block;
  /* Añadimos un margen negativo lateral para que se encimen ligeramente */
  margin: 0 -2%;
}

#prota {
max-width: 16%;
  z-index: 2;
}
#periodico {
max-width: 16%;  /* El único tamaño que cambiamos como pediste */
  margin-bottom: 40px; /* Para que parezca que alguien lo sostiene o flota */
  z-index: 3;
  margin-right: 50px;  /* Aumenta este número si lo quieres más a la izquierda aún */
  margin-left: -50px;
}

#policia {
z-index: 1;
}

      .interaccion-container {
 width: 100%;
  background: #e4c94fec; 
  padding: 30px 40px; /* Aumentamos el padding superior/inferior para dar más aire */
  box-sizing: border-box;
  display: flex;
  justify-content: space-between;
  align-items: center; /* ESTO centra verticalmente el texto y la columna de botones */
  gap: 40px;
  z-index: 10;
  position: relative;
  min-height: 25vh;
      }

      .texto-historia {
  width: 65%; /* Bajamos un poco el ancho para que no choque con los botones */
  color: #173668;
  font-size: 28px;
  font-family: 'Asar', serif;
  line-height: 1.5;
  display: flex;
  align-items: center;
      }

      .columna-botones {
  display: flex;
  flex-direction: column;
  gap: 15px; /* Un poco más de espacio entre botones */
  align-items: center; 
  justify-content: center; /* Centra los botones dentro de su propia columna */
  width: 30%;
  margin: 0;
      }

      .boton-accion {
        background: #123f93;
        color: #ffe25f;
        border: none;
        padding: 8px 20px;
        width: fit-content; 
        font-size: 18px;
        font-family: 'Amoria', sans-serif; 
        cursor: pointer;
        border-radius: 30px;
        transition: transform 0.2s;
        text-align: center;
      }

      .boton-accion:hover {
        transform: scale(1.05);
        background: #1a4eb3;
      }
    </style>
  </head>

  <body>


    <img src="assets/images/fondo vagon.jpeg" class="fondo-vagon" alt="Fondo Vagón">

<div class="contenedor-imagenes">

    <img src="assets/images/prota.png" class="imagen" id="prota" alt="Protagonista">

    <img src="assets/images/historiador.png" class="imagen" alt="Historiador">
    <img src="assets/images/periodico.png" class="imagen" id="periodico" alt="Periodico">
    <img src="assets/images/policia.png" class="imagen" id="policia" alt="Policia">
    </div>


    <div class="interaccion-container">


      <div class="texto-historia">
  
        Aunque no tienes totalmente claro lo que está pasando, definitivitamente no puedes dejar a Saimon a su suerte. <br>
        Tomas el valor para contrariar al Orangután y no entregarle el periódico.<br>
        El Orangután, firme y contundente, amenaza con tomar las mismas medidas contigo en caso de no retractarte.
      </div>

      <div class="columna-botones">
        <button class="boton-accion" onclick="window.location.href='Final SE QUEDA VIAJANDO EN EL METRO.html'">
          Te rindes. Entregas a Saimon y el periódico
        </button>

        <button class="boton-accion" onclick="window.location.href='Final ARRESTO.html'">
          Preguntar qué está pasando y por qué
        </button>

        <button class="boton-accion" onclick="window.location.href='Interacción 7.html'">
          Continuar apoyando a Saimon,<br>
          no obedecer al Orangután y desafiarlo
        </button>
      </div>

    </div>

  </body>
</html>
